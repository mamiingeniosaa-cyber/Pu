name: Compilar PUFFF Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Generar proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar AAB release
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - name: Firmar AAB cuando hay secretos de firma
        env:
          KEYSTORE_B64: ${{ secrets.PUFFF_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PUFFF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PUFFF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PUFFF_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pufff-release.jks"
            AAB=android/app/build/outputs/bundle/release/app-release.aab
            jarsigner -keystore "$RUNNER_TEMP/pufff-release.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
            jarsigner -verify "$AAB"
            mkdir -p dist
            cp "$AAB" dist/PUFFF-firmado-para-Google-Play.aab
          else
            echo 'Sin secretos de firma: AAB sin firmar.'
            mkdir -p dist
            cp android/app/build/outputs/bundle/release/app-release.aab dist/PUFFF-SIN-FIRMAR.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PUFFF-Android-AAB
          path: dist/*.aab
